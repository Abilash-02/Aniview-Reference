name: Build Android Debug APK

'on':
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.3'
          cache: true

      - name: Make Gradle wrapper executable
        run: chmod +x aniview-main/android/gradlew

      - name: Install dependencies
        working-directory: aniview-main
        run: flutter pub get

      - name: Generate and validate TOP_SITES configuration
        working-directory: aniview-main
        run: |
          top_sites=$(dart tool/top_sites.dart)
          if [ -z "$top_sites" ]; then
            echo "::error::TOP_SITES is empty"
            exit 1
          fi
          if [[ "$top_sites" != *"|http"* ]] || [[ "$top_sites" != *";"* ]]; then
            echo "::error::TOP_SITES format is malformed: $top_sites"
            exit 1
          fi
          echo "Generated TOP_SITES (${#top_sites} characters)"
          {
            echo "TOP_SITES<<EOF"
            echo "$top_sites"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Android Debug APK
        working-directory: aniview-main
        run: flutter build apk --debug "--dart-define=TOP_SITES=$TOP_SITES"

      - name: Verify TOP_SITES configuration in APK
        working-directory: aniview-main
        run: |
          python3 -c '
          import zipfile, sys
          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk, "r") as z:
              kernel = z.read("assets/flutter_assets/kernel_blob.bin")
              if b"reanime.to" in kernel or b"anikototv.to" in kernel:
                  print("SUCCESS: TOP_SITES verified in kernel_blob.bin")
              else:
                  print("FAILURE: TOP_SITES not found in kernel_blob.bin", file=sys.stderr)
                  sys.exit(1)
          '

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aniview-debug-apk
          path: aniview-main/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
