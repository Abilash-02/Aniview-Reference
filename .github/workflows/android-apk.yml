name: Build Android Debug APK

'on':
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.3'
          cache: true

      - name: Make Gradle wrapper executable
        run: chmod +x aniview-main/android/gradlew

      - name: Install dependencies
        working-directory: aniview-main
        run: flutter pub get

      - name: Run Flutter analyze
        working-directory: aniview-main
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: aniview-main
        run: flutter test

      - name: Generate and validate TOP_SITES configuration
        working-directory: aniview-main
        run: |
          top_sites=$(dart tool/top_sites.dart)
          if [ -z "$top_sites" ]; then
            echo "::error::TOP_SITES is empty"
            exit 1
          fi
          if [[ "$top_sites" != *"|http"* ]] || [[ "$top_sites" != *";"* ]]; then
            echo "::error::TOP_SITES format is malformed: $top_sites"
            exit 1
          fi
          echo "Generated TOP_SITES (${#top_sites} characters)"
          {
            echo "TOP_SITES<<EOF"
            echo "$top_sites"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Android Debug APK
        working-directory: aniview-main
        env:
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: |
          if [ -z "$ANILIST_CLIENT_ID" ]; then
            echo "::error::ANILIST_CLIENT_ID repository variable is not set"
            exit 1
          fi
          flutter build apk --debug \
            "--dart-define=TOP_SITES=$TOP_SITES" \
            "--dart-define=ANILIST_CLIENT_ID=$ANILIST_CLIENT_ID"

      - name: Verify TOP_SITES configuration in APK
        working-directory: aniview-main
        run: |
          python3 -c '
          import zipfile, sys
          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk, "r") as z:
              kernel = z.read("assets/flutter_assets/kernel_blob.bin")
              if b"reanime.to" in kernel or b"anikototv.to" in kernel:
                  print("SUCCESS: TOP_SITES verified in kernel_blob.bin")
              else:
                  print("FAILURE: TOP_SITES not found in kernel_blob.bin", file=sys.stderr)
                  sys.exit(1)
          '

      - name: Verify AniList Client ID configuration in APK
        working-directory: aniview-main
        env:
          ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
        run: |
          python3 -c '
          import zipfile, sys, os
          expected_id = os.environ.get("ANILIST_CLIENT_ID", "").strip()
          if not expected_id:
              print("FAILURE: ANILIST_CLIENT_ID environment variable is missing", file=sys.stderr)
              sys.exit(1)
          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk, "r") as z:
              kernel = z.read("assets/flutter_assets/kernel_blob.bin")
              if expected_id.encode("utf-8") in kernel:
                  print("SUCCESS: AniList Client ID verified in APK kernel_blob.bin")
              else:
                  print("FAILURE: AniList Client ID not found in APK kernel_blob.bin", file=sys.stderr)
                  sys.exit(1)
          '

      - name: Verify ANIZEN branding, launcher icons, and splash screen in APK
        working-directory: aniview-main
        run: |
          python3 -c '
          import zipfile, sys
          apk = "build/app/outputs/flutter-apk/app-debug.apk"
          with zipfile.ZipFile(apk, "r") as z:
              names = z.namelist()
              # Check launcher icons and splash
              splash_found = any("anizen_splash" in n for n in names)
              icon_found = any("ic_launcher" in n for n in names)
              fg_found = any("ic_launcher_foreground" in n for n in names)
              if not splash_found:
                  print("FAILURE: anizen_splash not found in APK resources", file=sys.stderr)
                  sys.exit(1)
              if not icon_found or not fg_found:
                  print("FAILURE: ic_launcher / foreground not found in APK resources", file=sys.stderr)
                  sys.exit(1)
              print("SUCCESS: Splash screen and launcher icons verified in APK resources")
              kernel = z.read("assets/flutter_assets/kernel_blob.bin")
              if b"ANIZEN" in kernel:
                  print("SUCCESS: ANIZEN branding verified in kernel_blob.bin")
              else:
                  print("FAILURE: ANIZEN branding not found in kernel_blob.bin", file=sys.stderr)
                  sys.exit(1)
          '

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anizen-debug-apk
          path: aniview-main/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
